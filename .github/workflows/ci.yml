name: Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: Python lint and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      rust-workspace: ${{ steps.workspace.outputs.present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Rust workspace in this checkout
        id: workspace
        run: |
          if [ -f rust/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Restore tracked executable modes
        run: |
          python - <<'PY'
          import os
          import subprocess
          for entry in subprocess.check_output(["git", "ls-files", "--stage", "-z"]).split(b"\0"):
              if not entry:
                  continue
              metadata, path = entry.split(b"\t", 1)
              if metadata.split()[0] == b"100755":
                  os.chmod(path, 0o755)
          PY
      - name: Install Python linter
        run: python -m pip install ruff==0.15.12
      - name: Lint Python
        run: ruff check --output-format github .
      - name: Run Python host tests
        run: python -B -m unittest discover -s tests -p 'test_i14_*.py' -v
      - name: Run boot-install and initramfs tests
        run: |
          python -B -m unittest discover -s tests -p 'test_boot_install.py' -v
          python -B initramfs/test-usb-network.py
          python -B initramfs/test-display-packaging.py

  rust:
    name: Rust lint and host tests
    needs: python
    if: needs.python.outputs.rust-workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Rust host tests
        run: cargo test --workspace --locked -- --nocapture

  arm64:
    name: ARM64 musl build
    needs: python
    if: needs.python.outputs.rust-workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build phone binaries
        run: cargo build --release --workspace --exclude i14-tools --exclude i14-fastboot --target aarch64-unknown-linux-musl --locked

  validation:
    name: Code validation
    needs: [python, rust, arm64]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_WORKSPACE: ${{ needs.python.outputs.rust-workspace }}
          RUST_RESULT: ${{ needs.rust.result }}
          ARM64_RESULT: ${{ needs.arm64.result }}
        run: |
          if [ "$PYTHON_RESULT" != "success" ]; then
            echo "Python lint and host tests did not succeed: $PYTHON_RESULT" >&2
            exit 1
          fi
          if [ "$RUST_WORKSPACE" = "true" ]; then
            if [ "$RUST_RESULT" != "success" ] || [ "$ARM64_RESULT" != "success" ]; then
              echo "Rust checks did not succeed: rust=$RUST_RESULT arm64=$ARM64_RESULT" >&2
              exit 1
            fi
          fi
