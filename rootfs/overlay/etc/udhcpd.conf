# Address for the computer on the USB cable. No router/DNS: the computer keeps its own internet.
# The gadget's host-side MAC changes on every (re)plug, so leases live in RAM and there
# are a few spare addresses; the first computer of a boot normally gets 172.16.42.2.
start 172.16.42.2
end 172.16.42.10
interface rndis0
max_leases 9
option subnet 255.255.255.0
lease_file /run/udhcpd.leases
