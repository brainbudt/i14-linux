# I14 reserve DNS for the home network: DNSSEC validated here, small caches.
# Design: docs/DNS-2026-11-04.md (from docs/research/offline-2026-11-03/01-dns-server.md).
# The home network intercepts all outgoing port 53 (UDP and TCP; even "root servers" answer REFUSED with
# RA set), so own recursion is impossible and plain forwarding would end at the interceptor. Hence
# DNS-over-TLS to two independent providers. The phone itself keeps the router's DNS (DHCP); this
# server is for other clients.
server:
	username: "unbound"
	chroot: ""
	directory: "/etc/unbound"
	do-daemonize: no
	interface: 0.0.0.0
	interface-automatic: yes  # answers from the address the query came to; Wi-Fi may come up later
	port: 53
	do-ip4: yes
	do-ip6: no
	do-udp: yes
	do-tcp: yes
	access-control: 0.0.0.0/0 refuse
	access-control: 127.0.0.0/8 allow
	# I14_DNS_CLIENTS
	# Copied from dnssec-root on install; unbound keeps it current itself (RFC 5011).
	auto-trust-anchor-file: "/var/lib/unbound/root.key"
	module-config: "validator iterator"
	num-threads: 1
	msg-cache-size: 4m
	rrset-cache-size: 8m
	key-cache-size: 2m
	neg-cache-size: 1m
	edns-buffer-size: 1232
	qname-minimisation: yes
	prefetch: yes
	hide-identity: yes
	hide-version: yes
	verbosity: 1
	log-queries: no
	use-syslog: yes
	tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
	# Health answer for the watchdog (i14-netwatch); 192.0.2.1 is a documentation address.
	local-zone: "i14-health.invalid." static
	local-data: "i14-health.invalid. 60 IN A 192.0.2.1"
forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 9.9.9.9@853#dns.quad9.net
	forward-addr: 149.112.112.112@853#dns.quad9.net
	forward-addr: 1.1.1.1@853#cloudflare-dns.com
	forward-addr: 1.0.0.1@853#cloudflare-dns.com
remote-control:
	control-enable: yes
	control-interface: /run/unbound.control.sock
